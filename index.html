<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Register · Studio Workflow</title>

  <!-- Google Fonts: Editorial Serif + Precision Sans + Tabular Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK (CDN — no build step) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    /* ── Editorial Design System: Warm Minimalist Studio ── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f9f8f5;
      --bg-alt: #f3f1ec;
      --surface: #ffffff;
      --surface-elevated: #ffffff;
      --surface-subtle: #fbfaf8;

      --ink-primary: #191816;
      --ink-secondary: #59554e;
      --ink-muted: #8c867e;
      --ink-faint: #b8b2a8;

      --border-subtle: #ece8e1;
      --border-strong: #d9d4cc;
      --border-focus: #191816;

      --accent-ink: #191816;
      --accent-ink-hover: #2e2b27;

      --status-overdue-bg: #fff5f5;
      --status-overdue-border: #fecaca;
      --status-overdue-ink: #991b1b;

      --status-followup-bg: #fefce8;
      --status-followup-border: #fef08a;
      --status-followup-ink: #854d0e;

      --status-live: #16a34a;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-pill: 9999px;

      --shadow-subtle: 0 1px 3px rgba(25, 24, 22, 0.04), 0 1px 2px rgba(25, 24, 22, 0.02);
      --shadow-card: 0 1px 4px rgba(25, 24, 22, 0.04), 0 4px 12px rgba(25, 24, 22, 0.03);
      --shadow-hover: 0 4px 16px rgba(25, 24, 22, 0.08), 0 1px 3px rgba(25, 24, 22, 0.04);
      --shadow-modal: 0 20px 48px rgba(25, 24, 22, 0.16), 0 4px 12px rgba(25, 24, 22, 0.08);

      --ease-tactile: cubic-bezier(0.16, 1, 0.3, 1);
      --duration: 0.18s;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--ink-primary);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* ── Typography Utilities ── */
    .font-serif { font-family: 'Newsreader', Georgia, serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: "tnum" 1; }

    /* ── Masthead ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
      background-color: rgba(255, 255, 255, 0.94);
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand-mark {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--ink-muted);
    }

    .brand-title {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--ink-primary);
      line-height: 1.15;
    }

    .brand-title em {
      font-style: italic;
      color: var(--ink-secondary);
    }

    .header-aside {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    /* Metrics Strip */
    .metrics-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--ink-secondary);
    }

    .metric-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .metric-label {
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .metric-value {
      font-weight: 600;
      color: var(--ink-primary);
    }

    .metric-value.overdue {
      color: var(--status-overdue-ink);
    }

    .metric-divider {
      color: var(--border-strong);
      user-select: none;
    }

    /* Pulsing Sync Capsule */
    .sync-capsule {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--surface-subtle);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--ink-secondary);
      letter-spacing: 0.02em;
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink-muted);
      transition: background var(--duration) var(--ease-tactile);
    }

    .sync-capsule.connected .sync-dot {
      background: var(--status-live);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
      animation: pulse-glow 2.4s infinite var(--ease-tactile);
    }

    .sync-capsule.disconnected .sync-dot {
      background: var(--status-overdue-ink);
      box-shadow: 0 0 0 3px rgba(153, 27, 27, 0.15);
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(0.9); }
    }

    /* ── Main Container ── */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    /* ── Assignment Deck (Add Task) ── */
    .deck-card {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      box-shadow: var(--shadow-card);
      margin-bottom: 32px;
      transition: border-color var(--duration) var(--ease-tactile);
    }

    .deck-card:focus-within {
      border-color: var(--border-strong);
    }

    .deck-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .deck-title {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--ink-primary);
    }

    .deck-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--ink-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2.2fr 1.5fr 1.2fr auto;
      gap: 16px;
      align-items: flex-end;
    }

    @media (max-width: 960px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
      .form-grid .btn-submit-cell {
        grid-column: span 2;
      }
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-grid .btn-submit-cell {
        grid-column: span 1;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.69rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-secondary);
    }

    .input-control {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.92rem;
      color: var(--ink-primary);
      background: var(--surface-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      outline: none;
      transition: all var(--duration) var(--ease-tactile);
      width: 100%;
    }

    .input-control:hover {
      border-color: var(--border-strong);
    }

    .input-control:focus {
      background: var(--surface);
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(25, 24, 22, 0.06);
    }

    select.input-control {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%2359554e' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 36px;
    }

    input[type="date"].input-control {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.86rem;
    }

    /* Tactile Buttons */
    .btn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 11px 22px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all var(--duration) var(--ease-tactile);
      white-space: nowrap;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-dark {
      background: var(--accent-ink);
      color: #ffffff;
      box-shadow: 0 1px 2px rgba(25, 24, 22, 0.1);
    }

    .btn-dark:hover {
      background: var(--accent-ink-hover);
      box-shadow: 0 2px 6px rgba(25, 24, 22, 0.16);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--ink-secondary);
      border-color: var(--border-subtle);
    }

    .btn-secondary:hover {
      background: var(--bg-alt);
      color: var(--ink-primary);
      border-color: var(--border-strong);
    }

    .btn-danger-ghost {
      background: transparent;
      color: var(--status-overdue-ink);
      border-color: transparent;
    }

    .btn-danger-ghost:hover {
      background: var(--status-overdue-bg);
      border-color: var(--status-overdue-border);
    }

    /* ── Filter Shelf ── */
    .filter-shelf {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .filter-shelf select, .filter-shelf input {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      color: var(--ink-primary);
      outline: none;
      transition: all var(--duration) var(--ease-tactile);
    }

    .filter-shelf select:hover, .filter-shelf input:hover {
      border-color: var(--border-strong);
    }

    .filter-shelf select:focus, .filter-shelf input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(25, 24, 22, 0.05);
    }

    .filter-search-box {
      min-width: 240px;
    }

    /* ── Kanban Architectural Columns ── */
    .board-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    @media (max-width: 960px) {
      .board-grid {
        grid-template-columns: 1fr;
        gap: 28px;
      }
    }

    .column {
      background: var(--bg-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px 16px;
      min-height: 400px;
      display: flex;
      flex-direction: column;
    }

    .column-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .column-heading {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .column-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--ink-muted);
    }

    .column-title {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 1.12rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--ink-primary);
    }

    .column-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--ink-secondary);
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    /* ── Task Card (High Craft) ── */
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      box-shadow: var(--shadow-subtle);
      transition: all var(--duration) var(--ease-tactile);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card:hover {
      box-shadow: var(--shadow-hover);
      border-color: var(--border-strong);
      transform: translateY(-1.5px);
    }

    .task-card.is-overdue {
      border-left: 3px solid var(--status-overdue-ink);
      background: linear-gradient(to right, rgba(254, 242, 242, 0.45), var(--surface));
    }

    .task-card-title {
      font-size: 0.96rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--ink-primary);
      letter-spacing: -0.01em;
      word-break: break-word;
    }

    /* Card Metadata Chips */
    .task-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
      font-size: 0.78rem;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.73rem;
      font-weight: 500;
      line-height: 1.3;
      border: 1px solid transparent;
    }

    .chip-person {
      background: var(--surface-subtle);
      border-color: var(--border-subtle);
      color: var(--ink-primary);
    }

    .chip-avatar {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--ink-primary);
      color: #ffffff;
      font-size: 0.55rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .chip-date {
      background: var(--surface-subtle);
      border-color: var(--border-subtle);
      color: var(--ink-secondary);
    }

    .chip-overdue {
      background: var(--status-overdue-bg);
      border-color: var(--status-overdue-border);
      color: var(--status-overdue-ink);
      font-weight: 600;
    }

    .chip-created {
      color: var(--ink-muted);
      font-size: 0.7rem;
      margin-left: auto;
    }

    /* Interactive Tile Follow-up Dock */
    .tile-followup-dock {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 9px 12px;
      background: var(--surface-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      transition: all var(--duration) var(--ease-tactile);
    }

    .tile-followup-dock:focus-within {
      border-color: var(--border-strong);
      background: var(--surface);
    }

    .tile-followup-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tile-followup-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tile-followup-input {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--ink-primary);
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 3px 6px;
      outline: none;
      cursor: pointer;
    }

    .tile-followup-input:focus {
      border-color: var(--border-focus);
      background: var(--surface);
    }

    .btn-followed-up {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--ink-primary);
      color: #ffffff;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all var(--duration) var(--ease-tactile);
    }

    .btn-followed-up:hover {
      background: var(--accent-ink-hover);
      transform: translateY(-1px);
    }

    .next-followup-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 6px 2px;
      animation: fadeIn 0.18s var(--ease-tactile);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .next-followup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--status-live);
      font-weight: 600;
    }

    .next-followup-presets {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .btn-preset-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--ink-primary);
      cursor: pointer;
      transition: all var(--duration) var(--ease-tactile);
    }

    .btn-preset-pill:hover {
      background: var(--ink-primary);
      color: #ffffff;
      border-color: var(--ink-primary);
    }

    .btn-dismiss-text {
      background: none;
      border: none;
      color: var(--ink-muted);
      font-size: 0.68rem;
      cursor: pointer;
      padding: 2px 4px;
      text-decoration: underline;
    }

    .btn-dismiss-text:hover {
      color: var(--ink-primary);
    }

    .followup-history-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--ink-muted);
    }

    /* Actions Bar */
    .card-actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }

    .card-nav-buttons {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .btn-action-pill {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: var(--radius-pill);
      background: var(--surface-subtle);
      color: var(--ink-secondary);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all var(--duration) var(--ease-tactile);
    }

    .btn-action-pill:hover {
      background: var(--ink-primary);
      color: #ffffff;
      border-color: var(--ink-primary);
    }

    .card-tool-buttons {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .btn-icon-subtle {
      background: transparent;
      border: none;
      color: var(--ink-muted);
      padding: 4px 6px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.76rem;
      font-weight: 500;
      transition: all var(--duration) var(--ease-tactile);
    }

    .btn-icon-subtle:hover {
      color: var(--ink-primary);
      background: var(--bg-alt);
    }

    .btn-icon-subtle.delete:hover {
      color: var(--status-overdue-ink);
      background: var(--status-overdue-bg);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--ink-muted);
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic;
      font-size: 0.98rem;
    }

    /* ── Modal Dialog (Tactile Studio Style) ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(25, 24, 22, 0.45);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      transition: opacity var(--duration) var(--ease-tactile);
    }

    .modal-backdrop.hidden {
      display: none;
    }

    .modal-window {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 32px;
      width: 100%;
      max-width: 460px;
      box-shadow: var(--shadow-modal);
      animation: modal-enter 0.22s var(--ease-tactile);
    }

    @keyframes modal-enter {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-headline {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 1.35rem;
      font-weight: 400;
      color: var(--ink-primary);
      margin-bottom: 24px;
      letter-spacing: -0.01em;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border-subtle);
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Masthead -->
  <header>
    <div class="header-inner">
      <div class="brand-mark">
        <span class="brand-eyebrow">Studio Task Register</span>
        <h1 class="brand-title">Editorial Workflow &amp; <em>Delivery Deck</em></h1>
      </div>

      <div class="header-aside">
        <div class="metrics-bar">
          <div class="metric-item">
            <span class="metric-label">Total</span>
            <span class="metric-value" id="stat-total">0</span>
          </div>
          <span class="metric-divider">/</span>
          <div class="metric-item">
            <span class="metric-label">Overdue</span>
            <span class="metric-value overdue" id="stat-overdue">0</span>
          </div>
          <span class="metric-divider">/</span>
          <div class="metric-item">
            <span class="metric-label">Done</span>
            <span class="metric-value" id="stat-done">0</span>
          </div>
        </div>

        <div class="sync-capsule" id="sync-capsule" title="Firebase Realtime Cloud Database Status">
          <span class="sync-dot"></span>
          <span id="sync-status">Connecting…</span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- Assignment Deck (New Task Form) -->
    <section class="deck-card" aria-labelledby="deck-heading">
      <div class="deck-header">
        <h2 id="deck-heading" class="deck-title">Record New Assignment</h2>
        <span class="deck-hint">Immediate Cloud Sync</span>
      </div>

      <div class="form-grid">
        <div class="input-group">
          <label class="input-label" for="task-title">Task Specification</label>
          <input type="text" id="task-title" class="input-control" placeholder="Describe the deliverable or milestone…" />
        </div>

        <div class="input-group">
          <label class="input-label" for="task-person">Assignee</label>
          <select id="task-person" class="input-control">
            <option value="">Select team member…</option>
            <option>Karishma Singh</option>
            <option>Sukriti Murarka</option>
            <option>Vijendra Singh</option>
            <option>Sujith AP</option>
            <option>Pradeep Karnataki</option>
            <option>Vinita Roche</option>
            <option>Prakash Adimulam</option>
            <option>Shruti</option>
            <option>Nikita</option>
            <option>Sandeep Gaikwad</option>
            <option>Hayden Pereira</option>
            <option>Manasi Bidikar</option>
            <option>Anit</option>
            <option>Saad Kazi</option>
            <option>Shreya Bose</option>
            <option>Kiran Wanhere</option>
            <option>Shreya Nair</option>
            <option>Maithali</option>
            <option>Hashim Omer</option>
          </select>
        </div>

        <div class="input-group">
          <label class="input-label" for="task-date">Due Date</label>
          <input type="date" id="task-date" class="input-control" />

        <div class="btn-submit-cell">
          <button class="btn btn-dark" onclick="addTask()">Add Assignment &rarr;</button>
        </div>
      </div>
    </section>

    <!-- Filter Shelf -->
    <section class="filter-shelf" aria-label="Task Filters">
      <div class="filter-group">
        <span class="filter-tagline">Filter</span>
        <select id="filter-person" onchange="renderBoard()">
          <option value="">All Team Members</option>
          <option>Karishma Singh</option>
          <option>Sukriti Murarka</option>
          <option>Vijendra Singh</option>
          <option>Sujith AP</option>
          <option>Pradeep Karnataki</option>
          <option>Vinita Roche</option>
          <option>Prakash Adimulam</option>
          <option>Shruti</option>
          <option>Nikita</option>
          <option>Sandeep Gaikwad</option>
          <option>Hayden Pereira</option>
          <option>Manasi Bidikar</option>
          <option>Anit</option>
          <option>Saad Kazi</option>
          <option>Shreya Bose</option>
          <option>Kiran Wanhere</option>
          <option>Shreya Nair</option>
          <option>Maithali</option>
          <option>Hashim Omer</option>
        </select>

        <select id="filter-overdue" onchange="renderBoard()">
          <option value="">All Deadlines</option>
          <option value="overdue">Overdue Only</option>
        </select>
      </div>

      <div class="filter-search-box">
        <input type="text" id="filter-search" placeholder="Search tasks or assignees…" oninput="renderBoard()" style="width: 100%;" />
      </div>
    </section>

    <!-- Kanban Architectural Columns -->
    <section class="board-grid" aria-label="Task Board">
      <!-- Column: To Do -->
      <div class="column" id="col-container-todo">
        <div class="column-header">
          <div class="column-heading">
            <span class="column-number">01</span>
            <h3 class="column-title">Backlog &amp; To Do</h3>
          </div>
          <span class="column-count" id="count-todo">0</span>
        </div>
        <div class="task-list" id="col-todo"></div>
      </div>

      <!-- Column: In Progress -->
      <div class="column" id="col-container-inprogress">
        <div class="column-header">
          <div class="column-heading">
            <span class="column-number">02</span>
            <h3 class="column-title">In Progress</h3>
          </div>
          <span class="column-count" id="count-inprogress">0</span>
        </div>
        <div class="task-list" id="col-inprogress"></div>
      </div>

      <!-- Column: Completed -->
      <div class="column" id="col-container-done">
        <div class="column-header">
          <div class="column-heading">
            <span class="column-number">03</span>
            <h3 class="column-title">Completed</h3>
          </div>
          <span class="column-count" id="count-done">0</span>
        </div>
        <div class="task-list" id="col-done"></div>
      </div>
    </section>
  </main>

  <!-- Edit Modal Window -->
  <div class="modal-backdrop hidden" id="edit-modal">
    <div class="modal-window" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 class="modal-headline" id="modal-title">Edit Assignment</h2>
      <input type="hidden" id="edit-id" />

      <div class="input-group" style="margin-bottom: 16px;">
        <label class="input-label" for="edit-title">Task Specification</label>
        <input type="text" id="edit-title" class="input-control" />
      </div>

      <div class="input-group" style="margin-bottom: 16px;">
        <label class="input-label" for="edit-person">Assignee</label>
        <select id="edit-person" class="input-control">
          <option value="">Select team member…</option>
          <option>Karishma Singh</option>
          <option>Sukriti Murarka</option>
          <option>Vijendra Singh</option>
          <option>Sujith AP</option>
          <option>Pradeep Karnataki</option>
          <option>Vinita Roche</option>
          <option>Prakash Adimulam</option>
          <option>Shruti</option>
          <option>Nikita</option>
          <option>Sandeep Gaikwad</option>
          <option>Hayden Pereira</option>
          <option>Manasi Bidikar</option>
          <option>Anit</option>
          <option>Saad Kazi</option>
          <option>Shreya Bose</option>
          <option>Kiran Wanhere</option>
          <option>Shreya Nair</option>
          <option>Maithali</option>
          <option>Hashim Omer</option>
        </select>
      </div>

      <div class="input-group" style="margin-bottom: 16px;">
        <label class="input-label" for="edit-date">Due Date</label>
        <input type="date" id="edit-date" class="input-control" />
      </div>

      <div class="input-group" style="margin-bottom: 16px;">
        <label class="input-label" for="edit-followup">Follow-up Date</label>
        <input type="date" id="edit-followup" class="input-control" />
      </div>

      <div class="input-group" style="margin-bottom: 16px;">
        <label class="input-label" for="edit-status">Status Column</label>
        <select id="edit-status" class="input-control">
          <option value="todo">Backlog &amp; To Do</option>
          <option value="inprogress">In Progress</option>
          <option value="done">Completed</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn btn-danger-ghost" onclick="deleteTaskFromModal()">Delete</button>
        <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
        <button class="btn btn-dark" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    // ══════════════════════════════════════
    // ── Firebase Configuration ──
    // ══════════════════════════════════════
    const firebaseConfig = {
      apiKey: "AIzaSyB6n_Q4AfuJNqLqa6on7fSFglWNBggALNc",
      authDomain: "task-tracker-c83ed.firebaseapp.com",
      databaseURL: "https://task-tracker-c83ed-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "task-tracker-c83ed",
      storageBucket: "task-tracker-c83ed.firebasestorage.app",
      messagingSenderId: "896706293913",
      appId: "1:896706293913:web:61d483ad63f510cf0c4808"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const tasksRef = db.ref('tasks');

    // ── Connection Status Indicator ──
    const syncStatusEl = document.getElementById('sync-status');
    const syncCapsuleEl = document.getElementById('sync-capsule');
    db.ref('.info/connected').on('value', snap => {
      if (snap.val() === true) {
        syncStatusEl.textContent = 'Live Synced';
        syncCapsuleEl.className = 'sync-capsule connected';
      } else {
        syncStatusEl.textContent = 'Offline';
        syncCapsuleEl.className = 'sync-capsule disconnected';
      }
    });

    // ══════════════════════════════════════
    // ── Live Tasks Cache ──
    // ══════════════════════════════════════
    let allTasks = [];

    tasksRef.on('value', snapshot => {
      allTasks = [];
      snapshot.forEach(child => {
        allTasks.push({ id: child.key, ...child.val() });
      });
      renderBoard();
    });

    // ── Date Formatting Helpers ──
    function isOverdue(dateStr, status) {
      if (status === 'done' || !dateStr) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return new Date(dateStr) < today;
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'No date';
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatCreated(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function getInitials(name) {
      if (!name) return '?';
      return name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
    }

    function setDefaultDueDate() {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const yyyy = tomorrow.getFullYear();
      const mm = String(tomorrow.getMonth() + 1).padStart(2, '0');
      const dd = String(tomorrow.getDate()).padStart(2, '0');
      document.getElementById('task-date').value = `${yyyy}-${mm}-${dd}`;
    }

    // ══════════════════════════════════════
    // ── Add Task ──
    // ══════════════════════════════════════
    function addTask() {
      const title = document.getElementById('task-title').value.trim();
      const person = document.getElementById('task-person').value;
      const date = document.getElementById('task-date').value;

      if (!title) {
        document.getElementById('task-title').focus();
        return;
      }

      tasksRef.push({
        title,
        person,
        date,
        followup: '',
        status: 'todo',
        createdAt: new Date().toISOString()
      });

      // Clear form
      document.getElementById('task-title').value = '';
      document.getElementById('task-person').value = '';
      setDefaultDueDate();
      document.getElementById('task-title').focus();
    }

    // Allow Enter key to submit task
    document.querySelectorAll('.deck-card input').forEach(input => {
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') addTask();
      });
    });

    // ══════════════════════════════════════
    // ── Update & Delete Handlers ──
    // ══════════════════════════════════════
    function moveTask(id, newStatus) {
      tasksRef.child(id).update({ status: newStatus });
    }

    function markFollowedUp(id) {
      const task = allTasks.find(t => t.id === id);
      const currentCount = (task && task.followupCount) ? task.followupCount : 0;
      const todayIso = new Date().toISOString();
      tasksRef.child(id).update({
        lastFollowup: todayIso,
        followupCount: currentCount + 1,
        followup: '',
        promptNextFollowup: true
      });
    }

    function scheduleNextFollowup(id, daysAhead) {
      const nextDate = new Date();
      nextDate.setDate(nextDate.getDate() + daysAhead);
      const yyyy = nextDate.getFullYear();
      const mm = String(nextDate.getMonth() + 1).padStart(2, '0');
      const dd = String(nextDate.getDate()).padStart(2, '0');
      const dateStr = `${yyyy}-${mm}-${dd}`;
      tasksRef.child(id).update({
        followup: dateStr,
        promptNextFollowup: false
      });
    }

    function dismissNextFollowup(id) {
      tasksRef.child(id).update({
        promptNextFollowup: false
      });
    }

    function updateFollowup(id, val) {
      tasksRef.child(id).update({
        followup: val,
        promptNextFollowup: false
      });
    }

    function deleteTask(id) {
      if (!confirm('Are you sure you want to delete this assignment?')) return;
      tasksRef.child(id).remove();
    }

    // ══════════════════════════════════════
    // ── Edit Modal Logic ──
    // ══════════════════════════════════════
    function openEditModal(id) {
      const task = allTasks.find(t => t.id === id);
      if (!task) return;

      document.getElementById('edit-id').value = id;
      document.getElementById('edit-title').value = task.title;
      document.getElementById('edit-person').value = task.person || '';
      document.getElementById('edit-date').value = task.date || '';
      document.getElementById('edit-followup').value = task.followup || '';
      document.getElementById('edit-status').value = task.status || 'todo';
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    function saveEdit() {
      const id = document.getElementById('edit-id').value;

      tasksRef.child(id).update({
        title: document.getElementById('edit-title').value.trim(),
        person: document.getElementById('edit-person').value,
        date: document.getElementById('edit-date').value,
        followup: document.getElementById('edit-followup').value,
        status: document.getElementById('edit-status').value
      });

      closeEditModal();
    }

    function deleteTaskFromModal() {
      const id = document.getElementById('edit-id').value;
      closeEditModal();
      deleteTask(id);
    }

    document.getElementById('edit-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeEditModal();
    });

    // ══════════════════════════════════════
    // ── Render Board Engine ──
    // ══════════════════════════════════════
    function renderBoard() {
      const tasks = allTasks;
      const filterPerson = document.getElementById('filter-person').value;
      const filterOverdue = document.getElementById('filter-overdue').value;
      const searchTerm = document.getElementById('filter-search').value.toLowerCase();

      // Filter tasks
      const filtered = tasks.filter(t => {
        if (filterPerson && t.person !== filterPerson) return false;
        if (filterOverdue === 'overdue' && !isOverdue(t.date, t.status)) return false;
        if (searchTerm && !t.title.toLowerCase().includes(searchTerm) && !(t.person || '').toLowerCase().includes(searchTerm)) return false;
        return true;
      });

      // Sort: overdue first, then by date
      filtered.sort((a, b) => {
        const aOver = isOverdue(a.date, a.status) ? 0 : 1;
        const bOver = isOverdue(b.date, b.status) ? 0 : 1;
        if (aOver !== bOver) return aOver - bOver;
        if (!a.date) return 1;
        if (!b.date) return -1;
        return new Date(a.date) - new Date(b.date);
      });

      const groups = { todo: [], inprogress: [], done: [] };
      filtered.forEach(t => {
        if (groups[t.status]) groups[t.status].push(t);
      });

      // Render each column
      ['todo', 'inprogress', 'done'].forEach(status => {
        const col = document.getElementById('col-' + status);
        const count = document.getElementById('count-' + status);
        count.textContent = String(groups[status].length).padStart(2, '0');

        if (groups[status].length === 0) {
          col.innerHTML = '<div class="empty-state">No assignments in this stage</div>';
          return;
        }

        col.innerHTML = groups[status].map(t => {
          const overdue = isOverdue(t.date, t.status);

          const statusButtons = ['todo', 'inprogress', 'done']
            .filter(s => s !== t.status)
            .map(s => {
              const labels = {
                todo: '&larr; To Do',
                inprogress: 'In Progress &rarr;',
                done: '&check; Complete'
              };
              return `<button class="btn-action-pill" onclick="moveTask('${t.id}','${s}')">${labels[s]}</button>`;
            }).join('');

          return `
            <article class="task-card ${overdue ? 'is-overdue' : ''}">
              <div class="task-card-title">${escapeHtml(t.title)}</div>

              <div class="task-meta-row">
                ${t.person ? `
                  <span class="chip chip-person">
                    <span class="chip-avatar">${getInitials(t.person)}</span>
                    ${escapeHtml(t.person)}
                  </span>
                ` : ''}

                ${t.date ? `
                  <span class="chip ${overdue ? 'chip-overdue' : 'chip-date'}">
                    ${overdue ? '&bull; Overdue' : '&bull; Due'} ${formatDate(t.date)}
                  </span>
                ` : ''}

                ${t.createdAt ? `
                  <span class="chip-created" title="Entry timestamp">
                    Entered ${formatCreated(t.createdAt)}
                  </span>
                ` : ''}
              </div>

              ${t.promptNextFollowup ? `
                <div class="tile-followup-dock">
                  <div class="next-followup-box">
                    <div class="next-followup-header">
                      <span>&check; Follow-up logged! Schedule Next:</span>
                      <button class="btn-dismiss-text" onclick="dismissNextFollowup('${t.id}')">Dismiss</button>
                    </div>
                    <div class="next-followup-presets">
                      <button class="btn-preset-pill" onclick="scheduleNextFollowup('${t.id}', 1)">+1d (Tomorrow)</button>
                      <button class="btn-preset-pill" onclick="scheduleNextFollowup('${t.id}', 3)">+3d</button>
                      <button class="btn-preset-pill" onclick="scheduleNextFollowup('${t.id}', 7)">+1 Week</button>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px;">
                      <span style="font-family:'JetBrains Mono',monospace; font-size:0.69rem; color:var(--ink-muted);">Or pick date:</span>
                      <input
                        type="date"
                        class="tile-followup-input"
                        onchange="updateFollowup('${t.id}', this.value)"
                        title="Set custom next follow-up date"
                      />
                    </div>
                  </div>
                </div>
              ` : `
                <div class="tile-followup-dock">
                  <div class="tile-followup-row">
                    <label class="tile-followup-label" for="fup-${t.id}">
                      <span>Follow-up</span>
                    </label>
                    <div style="display:flex; align-items:center; gap:6px;">
                      <input
                        type="date"
                        class="tile-followup-input"
                        id="fup-${t.id}"
                        value="${t.followup || ''}"
                        onchange="updateFollowup('${t.id}', this.value)"
                        title="Set or change follow-up date"
                      />
                      ${t.followup ? `
                        <button class="btn-followed-up" onclick="markFollowedUp('${t.id}')" title="Log this follow-up as done and choose next date">
                          &check; Followed Up
                        </button>
                      ` : ''}
                    </div>
                  </div>
                  ${t.lastFollowup ? `
                    <div class="followup-history-text">
                      Last follow-up: ${formatCreated(t.lastFollowup)} ${t.followupCount ? `(#${t.followupCount})` : ''}
                    </div>
                  ` : ''}
                </div>
              `}

              <footer class="card-actions-bar">
                <div class="card-nav-buttons">
                  ${statusButtons}
                </div>
                <div class="card-tool-buttons">
                  <button class="btn-icon-subtle" onclick="openEditModal('${t.id}')" title="Edit assignment details">Edit</button>
                  <button class="btn-icon-subtle delete" onclick="deleteTask('${t.id}')" title="Remove assignment">&times;</button>
                </div>
              </footer>
            </article>`;
        }).join('');
      });

      // Update Top Metrics Readout
      document.getElementById('stat-total').textContent = String(tasks.length).padStart(2, '0');
      document.getElementById('stat-overdue').textContent = String(tasks.filter(t => isOverdue(t.date, t.status)).length).padStart(2, '0');
      document.getElementById('stat-done').textContent = String(tasks.filter(t => t.status === 'done').length).padStart(2, '0');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Initial State ──
    setDefaultDueDate();
  </script>
</body>
</html>
