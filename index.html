<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks</title>

  <!-- Inter Font (Nexflow standard) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Firebase SDK (CDN — no build step) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    /* ══════════════════════════════════════════════════════════════════
       ── Nexflow Design System (nexflow.solutions) ──
       Deep Midnight Canvas, Coral Orange (#ff5b37), High-Contrast Glass
       ══════════════════════════════════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --nx-bg: #0c0e14;
      --nx-bg-subtle: #090b10;
      --nx-card: rgba(255, 255, 255, 0.035);
      --nx-card-hover: rgba(255, 255, 255, 0.06);
      --nx-card-elevated: #131722;

      --nx-border: rgba(255, 255, 255, 0.08);
      --nx-border-strong: rgba(255, 255, 255, 0.16);

      --nx-text: #ffffff;
      --nx-muted: #94a3b8;
      --nx-faint: rgba(255, 255, 255, 0.35);

      --nx-orange: #ff5b37;
      --nx-orange-hover: #f14d2a;
      --nx-orange-bg: rgba(255, 91, 55, 0.12);
      --nx-orange-border: rgba(255, 91, 55, 0.3);
      --nx-orange-glow: rgba(255, 91, 55, 0.25);

      --nx-purple: #8b5cf6;
      --nx-purple-bg: rgba(139, 92, 246, 0.12);
      --nx-purple-border: rgba(139, 92, 246, 0.28);

      --nx-emerald: #10b981;
      --nx-emerald-bg: rgba(16, 185, 129, 0.12);
      --nx-emerald-border: rgba(16, 185, 129, 0.28);

      --nx-blue: #3b82f6;
      --nx-blue-bg: rgba(59, 130, 246, 0.12);

      --nx-rose: #f43f5e;
      --nx-rose-bg: rgba(244, 63, 94, 0.12);
      --nx-rose-border: rgba(244, 63, 94, 0.3);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-pill: 9999px;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.35);
      --shadow-glow: 0 0 28px -4px var(--nx-orange-glow);
      --shadow-modal: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);

      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--nx-bg);
      color: var(--nx-text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      position: relative;
    }

    /* Nexflow Signature Ambient Atmospheric Glow */
    .ambient-glow {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 760px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 91, 55, 0.13) 0%, rgba(139, 92, 246, 0.05) 50%, transparent 75%);
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }

    /* Nexflow Micro Dot Grid Overlay */
    .dot-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse 65% 55% at 50% 20%, #000 25%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 65% 55% at 50% 20%, #000 25%, transparent 75%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Sticky Frosted Header (Nexflow Style) ── */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(12, 14, 20, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--nx-border);
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      position: relative;
      z-index: 10;
    }

    /* Nexflow Brand Logo */
    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #ff5b37 0%, #ff7b5a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--nx-orange-glow);
    }

    .brand-icon svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
    }

    .brand-logo-text {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 1px;
    }

    .brand-logo-text span {
      color: var(--nx-orange);
    }

    .brand-subline {
      font-size: 0.7rem;
      color: var(--nx-muted);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* Header Controls */
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Nexflow Counters Capsule */
    .stats-shelf {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--nx-border);
      border-radius: var(--radius-pill);
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--nx-muted);
      padding: 2px 6px;
    }

    .stat-badge strong {
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }

    .stat-badge.overdue strong {
      color: var(--nx-rose);
    }

    .stat-divider {
      color: var(--nx-border);
      user-select: none;
    }

    /* Live Cloud Status Chip */
    .sync-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: var(--nx-emerald-bg);
      border: 1px solid var(--nx-emerald-border);
      color: var(--nx-emerald);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.15);
      transition: all 0.2s var(--ease);
    }

    .sync-pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
      animation: pulse-ring 2s infinite ease-in-out;
    }

    .sync-status-pill.disconnected {
      background: var(--nx-rose-bg);
      border-color: var(--nx-rose-border);
      color: var(--nx-rose);
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.15);
    }

    @keyframes pulse-ring {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* ── Main Layout ── */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px 80px;
      position: relative;
      z-index: 10;
    }

    /* ── Nexflow Action Card (New Task Deck) ── */
    .nex-card {
      background: var(--nx-card);
      border: 1px solid var(--nx-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      margin-bottom: 28px;
      transition: border-color 0.2s var(--ease);
      position: relative;
      overflow: hidden;
    }

    .nex-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 91, 55, 0.35), transparent);
    }

    .nex-card:focus-within {
      border-color: var(--nx-border-strong);
    }

    .card-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-pill-tag {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: var(--nx-orange-bg);
      border: 1px solid var(--nx-orange-border);
      color: var(--nx-orange);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2.3fr 1.5fr 1.2fr auto;
      gap: 14px;
      align-items: flex-end;
    }

    @media (max-width: 960px) {
      .form-grid { grid-template-columns: 1fr 1fr; }
      .submit-cell { grid-column: span 2; }
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .submit-cell { grid-column: span 1; }
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--nx-muted);
    }

    .nx-input, .nx-select {
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--nx-border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      outline: none;
      transition: all 0.2s var(--ease);
      width: 100%;
    }

    .nx-input::placeholder {
      color: var(--nx-faint);
    }

    .nx-input:hover, .nx-select:hover {
      border-color: var(--nx-border-strong);
      background: rgba(255, 255, 255, 0.06);
    }

    .nx-input:focus, .nx-select:focus {
      border-color: var(--nx-orange);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 0 3px var(--nx-orange-glow);
    }

    select.nx-select {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%2394a3b8' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 36px;
    }

    select.nx-select option {
      background: #131722;
      color: #ffffff;
    }

    input[type="date"].nx-input {
      color-scheme: dark;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
    }

    /* ── Nexflow Vibrant Buttons ── */
    .btn-nx-primary {
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: #ffffff;
      background: var(--nx-orange);
      border: none;
      border-radius: var(--radius-md);
      padding: 11px 22px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 4px 18px var(--nx-orange-glow);
      transition: all 0.2s var(--ease);
      white-space: nowrap;
      user-select: none;
    }

    .btn-nx-primary:hover {
      background: var(--nx-orange-hover);
      box-shadow: 0 6px 24px rgba(255, 91, 55, 0.4);
      transform: translateY(-1px);
    }

    .btn-nx-primary:active {
      transform: scale(0.98);
    }

    .btn-nx-secondary {
      font-family: 'Inter', sans-serif;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--nx-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--nx-border);
      border-radius: var(--radius-sm);
      padding: 9px 18px;
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }

    .btn-nx-secondary:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--nx-border-strong);
    }

    .btn-nx-danger {
      font-family: 'Inter', sans-serif;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--nx-rose);
      background: var(--nx-rose-bg);
      border: 1px solid var(--nx-rose-border);
      border-radius: var(--radius-sm);
      padding: 9px 18px;
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }

    .btn-nx-danger:hover {
      background: rgba(244, 63, 94, 0.2);
    }

    /* ── Nexflow Filter Shelf ── */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-tag {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--nx-muted);
    }

    .filter-bar select, .filter-bar input {
      font-size: 0.82rem;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--nx-border);
      color: #ffffff;
      outline: none;
      transition: all 0.2s var(--ease);
    }

    .filter-bar select:hover, .filter-bar input:hover {
      border-color: var(--nx-border-strong);
    }

    .filter-bar select:focus, .filter-bar input:focus {
      border-color: var(--nx-orange);
      box-shadow: 0 0 0 2px var(--nx-orange-glow);
    }

    .filter-search-box {
      min-width: 260px;
    }

    /* ── Kanban Columns (Nexflow Workspaces Style) ── */
    .board-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media (max-width: 960px) {
      .board-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    .column {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--nx-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      min-height: 440px;
      display: flex;
      flex-direction: column;
    }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--nx-border);
    }

    .column-tag {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .column-status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .col-todo .column-status-indicator { background: var(--nx-orange); box-shadow: 0 0 8px var(--nx-orange-glow); }
    .col-inprogress .column-status-indicator { background: var(--nx-blue); box-shadow: 0 0 8px rgba(59, 130, 246, 0.4); }
    .col-done .column-status-indicator { background: var(--nx-emerald); box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }

    .column-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }

    .column-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--nx-muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--nx-border);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    /* ── Nexflow Modern Task Card ── */
    .task-card {
      background: var(--nx-card);
      border: 1px solid var(--nx-border);
      border-radius: var(--radius-md);
      padding: 15px 16px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s var(--ease);
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .task-card:hover {
      background: var(--nx-card-hover);
      border-color: rgba(255, 91, 55, 0.4);
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 91, 55, 0.15);
      transform: translateY(-2px);
    }

    .task-card.is-overdue {
      border-left: 3px solid var(--nx-rose);
      background: linear-gradient(90deg, rgba(244, 63, 94, 0.07), var(--nx-card));
    }

    .task-title {
      font-size: 0.94rem;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.4;
      word-break: break-word;
    }

    /* Metadata Chips */
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 8px;
      align-items: center;
    }

    .nx-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-weight: 500;
      line-height: 1.3;
      border: 1px solid transparent;
    }

    .badge-person {
      background: var(--nx-purple-bg);
      border-color: var(--nx-purple-border);
      color: #c4b5fd;
    }

    .badge-person .avatar {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--nx-purple);
      color: #ffffff;
      font-size: 0.52rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .badge-date {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--nx-border);
      color: var(--nx-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .badge-overdue {
      background: var(--nx-rose-bg);
      border-color: var(--nx-rose-border);
      color: var(--nx-rose);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .badge-created {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--nx-faint);
      margin-left: auto;
    }

    /* ── Follow-up Glass Dock ── */
    .followup-dock {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--nx-border);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s var(--ease);
    }

    .followup-dock:focus-within {
      border-color: var(--nx-orange-border);
    }

    .followup-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .followup-tag {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--nx-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .followup-date-input {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color-scheme: dark;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--nx-border);
      border-radius: 6px;
      padding: 3px 8px;
      outline: none;
      cursor: pointer;
    }

    .followup-date-input:focus {
      border-color: var(--nx-orange);
    }

    /* Nexflow Followed Up Pill Button */
    .btn-followup-check {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: var(--radius-pill);
      background: var(--nx-orange);
      color: #ffffff;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 10px var(--nx-orange-glow);
      transition: all 0.2s var(--ease);
    }

    .btn-followup-check:hover {
      background: var(--nx-orange-hover);
      transform: translateY(-1px);
    }

    /* Next Follow-up Prompt Box */
    .next-prompt-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.18s var(--ease);
    }

    .next-prompt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.73rem;
      font-weight: 600;
      color: var(--nx-emerald);
    }

    .next-prompt-presets {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .preset-chip {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--nx-border);
      color: #ffffff;
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }

    .preset-chip:hover {
      background: var(--nx-orange);
      border-color: var(--nx-orange);

  <script>
    // ══════════════════════════════════════
    // ── Firebase Configuration ──
    // ══════════════════════════════════════
    const firebaseConfig = {
      apiKey: "AIzaSyB6n_Q4AfuJNqLqa6on7fSFglWNBggALNc",
      authDomain: "task-tracker-c83ed.firebaseapp.com",
      databaseURL: "https://task-tracker-c83ed-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "task-tracker-c83ed",
      storageBucket: "task-tracker-c83ed.firebasestorage.app",
      messagingSenderId: "896706293913",
      appId: "1:896706293913:web:61d483ad63f510cf0c4808"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const tasksRef = db.ref('tasks');

    // ── Connection Status ──
    const syncStatusEl = document.getElementById('sync-status');
    const syncPillEl = document.getElementById('sync-pill');
    db.ref('.info/connected').on('value', snap => {
      if (snap.val() === true) {
        syncStatusEl.textContent = 'Live Synced';
        syncPillEl.className = 'sync-status-pill';
      } else {
        syncStatusEl.textContent = 'Offline';
        syncPillEl.className = 'sync-status-pill disconnected';
      }
    });

    // ══════════════════════════════════════
    // ── Live Tasks Cache ──
    // ══════════════════════════════════════
    let allTasks = [];

    tasksRef.on('value', snapshot => {
      allTasks = [];
      snapshot.forEach(child => {
        allTasks.push({ id: child.key, ...child.val() });
      });
      renderBoard();
    });

    // ── Helpers ──
    function isOverdue(dateStr, status) {
      if (status === 'done' || !dateStr) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return new Date(dateStr) < today;
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'No date';
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatCreated(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function formatFullDateTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      }) + ' at ' + d.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
    }

    function getInitials(name) {
      if (!name) return '?';
      return name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
    }

    function setDefaultDueDate() {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const yyyy = tomorrow.getFullYear();
      const mm = String(tomorrow.getMonth() + 1).padStart(2, '0');
      const dd = String(tomorrow.getDate()).padStart(2, '0');
      document.getElementById('task-date').value = `${yyyy}-${mm}-${dd}`;
    }

    const openHistoryDrawers = new Set();
    function toggleHistory(id) {
      if (openHistoryDrawers.has(id)) {
        openHistoryDrawers.delete(id);
      } else {
        openHistoryDrawers.add(id);
      }
      renderBoard();
    }

    function getTaskHistory(t) {
      if (!t) return [];
      if (t.followupHistory) {
        return Array.isArray(t.followupHistory) ? t.followupHistory : Object.values(t.followupHistory);
      }
      if (t.lastFollowup) {
        return [{
          completedAt: t.lastFollowup,
          number: t.followupCount || 1
        }];
      }
      return [];
    }

    // ══════════════════════════════════════
    // ── Add Task ──
    // ══════════════════════════════════════
    function addTask() {
      const title = document.getElementById('task-title').value.trim();
      const person = document.getElementById('task-person').value;
      const date = document.getElementById('task-date').value;

      if (!title) {
        document.getElementById('task-title').focus();
        return;
      }

      tasksRef.push({
        title,
        person,
        date,
        followup: '',
        status: 'todo',
        createdAt: new Date().toISOString()
      });

      document.getElementById('task-title').value = '';
      document.getElementById('task-person').value = '';
      setDefaultDueDate();
      document.getElementById('task-title').focus();
    }

    document.querySelectorAll('.nex-card input').forEach(input => {
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') addTask();
      });
    });

    // ══════════════════════════════════════
    // ── Update & Delete Handlers ──
    // ══════════════════════════════════════
    function moveTask(id, newStatus) {
      tasksRef.child(id).update({ status: newStatus });
    }

    function markFollowedUp(id) {
      const task = allTasks.find(t => t.id === id);
      const currentCount = (task && task.followupCount) ? task.followupCount : 0;
      const todayIso = new Date().toISOString();

      let history = [];
      if (task && task.followupHistory) {
        history = Array.isArray(task.followupHistory) ? [...task.followupHistory] : Object.values(task.followupHistory);
      } else if (task && task.lastFollowup) {
        history.push({
          completedAt: task.lastFollowup,
          number: currentCount || 1
        });
      }

      history.push({
        completedAt: todayIso,
        number: currentCount + 1
      });

      tasksRef.child(id).update({
        lastFollowup: todayIso,
        followupCount: currentCount + 1,
        followupHistory: history,
        followup: '',
        promptNextFollowup: true
      });
    }

    function scheduleNextFollowup(id, daysAhead) {
      const nextDate = new Date();
      nextDate.setDate(nextDate.getDate() + daysAhead);
      const yyyy = nextDate.getFullYear();
      const mm = String(nextDate.getMonth() + 1).padStart(2, '0');
      const dd = String(nextDate.getDate()).padStart(2, '0');
      const dateStr = `${yyyy}-${mm}-${dd}`;
      tasksRef.child(id).update({
        followup: dateStr,
        promptNextFollowup: false
      });
    }

    function dismissNextFollowup(id) {
      tasksRef.child(id).update({
        promptNextFollowup: false
      });
    }

    function updateFollowup(id, val) {
      tasksRef.child(id).update({
        followup: val,
        promptNextFollowup: false
      });
    }

    function deleteTask(id) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      tasksRef.child(id).remove();
    }

    // ══════════════════════════════════════
    // ── Edit Modal Logic ──
    // ══════════════════════════════════════
    function openEditModal(id) {
      const task = allTasks.find(t => t.id === id);
      if (!task) return;

      document.getElementById('edit-id').value = id;
      document.getElementById('edit-title').value = task.title;
      document.getElementById('edit-person').value = task.person || '';
      document.getElementById('edit-date').value = task.date || '';
      document.getElementById('edit-followup').value = task.followup || '';
      document.getElementById('edit-status').value = task.status || 'todo';
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    function saveEdit() {
      const id = document.getElementById('edit-id').value;

      tasksRef.child(id).update({
        title: document.getElementById('edit-title').value.trim(),
        person: document.getElementById('edit-person').value,
        date: document.getElementById('edit-date').value,
        followup: document.getElementById('edit-followup').value,
        status: document.getElementById('edit-status').value
      });

      closeEditModal();
    }

    function deleteTaskFromModal() {
      const id = document.getElementById('edit-id').value;
      closeEditModal();
      deleteTask(id);
    }

    document.getElementById('edit-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeEditModal();
    });

    // ══════════════════════════════════════
    // ── Render Board Engine ──
    // ══════════════════════════════════════
    function renderBoard() {
      const tasks = allTasks;
      const filterPerson = document.getElementById('filter-person').value;
      const filterOverdue = document.getElementById('filter-overdue').value;
      const searchTerm = document.getElementById('filter-search').value.toLowerCase();

      // Filter tasks
      const filtered = tasks.filter(t => {
        if (filterPerson && t.person !== filterPerson) return false;
        if (filterOverdue === 'overdue' && !isOverdue(t.date, t.status)) return false;
        if (searchTerm && !t.title.toLowerCase().includes(searchTerm) && !(t.person || '').toLowerCase().includes(searchTerm)) return false;
        return true;
      });

      // Sort: overdue first, then by date
      filtered.sort((a, b) => {
        const aOver = isOverdue(a.date, a.status) ? 0 : 1;
        const bOver = isOverdue(b.date, b.status) ? 0 : 1;
        if (aOver !== bOver) return aOver - bOver;
        if (!a.date) return 1;
        if (!b.date) return -1;
        return new Date(a.date) - new Date(b.date);
      });

      const groups = { todo: [], inprogress: [], done: [] };
      filtered.forEach(t => {
        if (groups[t.status]) groups[t.status].push(t);
      });

      // Render each column
      ['todo', 'inprogress', 'done'].forEach(status => {
        const col = document.getElementById('col-' + status);
        const count = document.getElementById('count-' + status);
        count.textContent = String(groups[status].length).padStart(2, '0');

        if (groups[status].length === 0) {
          col.innerHTML = '<div class="empty-state">No tasks in this lane</div>';
          return;
        }

        col.innerHTML = groups[status].map(t => {
          const overdue = isOverdue(t.date, t.status);
          const taskHistory = getTaskHistory(t);
          const isHistoryOpen = openHistoryDrawers.has(t.id);

          const statusButtons = ['todo', 'inprogress', 'done']
            .filter(s => s !== t.status)
            .map(s => {
              const labels = {
                todo: '&larr; To Do',
                inprogress: 'In Progress &rarr;',
                done: '&check; Complete'
              };
              return `<button class="btn-flow" onclick="moveTask('${t.id}','${s}')">${labels[s]}</button>`;
            }).join('');

          const historyMarkup = (taskHistory.length > 0) ? `
            <div class="history-bar">
              <span>${taskHistory.length} past follow-up${taskHistory.length > 1 ? 's' : ''}</span>
              <button type="button" class="btn-toggle-log" onclick="toggleHistory('${t.id}')">
                ${isHistoryOpen ? 'Hide History &blacktriangle;' : 'View All (' + taskHistory.length + ') &blacktriangledown;'}
              </button>
            </div>
            ${isHistoryOpen ? `
              <div class="history-drawer">
                <div class="history-title">Follow-up Log (${taskHistory.length})</div>
                ${taskHistory.slice().reverse().map(h => `
                  <div class="history-item">
                    <span class="history-node">#${h.number || ''}</span>
                    <span class="history-time">${formatFullDateTime(h.completedAt)}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          ` : '';

          return `
            <article class="task-card ${overdue ? 'is-overdue' : ''}">
              <div class="task-title">${escapeHtml(t.title)}</div>

              <div class="meta-row">
                ${t.person ? `
                  <span class="nx-badge badge-person">
                    <span class="avatar">${getInitials(t.person)}</span>
                    ${escapeHtml(t.person)}
                  </span>
                ` : ''}

                ${t.date ? `
                  <span class="nx-badge ${overdue ? 'badge-overdue' : 'badge-date'}">
                    ${overdue ? '&bull; Overdue' : '&bull; Due'} ${formatDate(t.date)}
                  </span>
                ` : ''}

                ${t.createdAt ? `
                  <span class="badge-created" title="Captured date">
                    Entered ${formatCreated(t.createdAt)}
                  </span>
                ` : ''}
              </div>

              ${t.promptNextFollowup ? `
                <div class="followup-dock">
                  <div class="next-prompt-box">
                    <div class="next-prompt-header">
                      <span>&check; Follow-up logged! Schedule Next:</span>
                      <button class="btn-dismiss" onclick="dismissNextFollowup('${t.id}')">Dismiss</button>
                    </div>
                    <div class="next-prompt-presets">
                      <button class="preset-chip" onclick="scheduleNextFollowup('${t.id}', 1)">+1d (Tomorrow)</button>
                      <button class="preset-chip" onclick="scheduleNextFollowup('${t.id}', 3)">+3d</button>
                      <button class="preset-chip" onclick="scheduleNextFollowup('${t.id}', 7)">+1 Week</button>
                    </div>
                    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px;">
                      <span style="font-size:0.7rem; color:var(--nx-muted);">Or custom date:</span>
                      <input
                        type="date"
                        class="followup-date-input"
                        onchange="updateFollowup('${t.id}', this.value)"
                        title="Set next date"
                      />
                    </div>
                  </div>
                  ${historyMarkup}
                </div>
              ` : `
                <div class="followup-dock">
                  <div class="followup-row">
                    <label class="followup-tag" for="fup-${t.id}">
                      <span>Follow-up</span>
                    </label>
                    <div style="display:flex; align-items:center; gap:6px;">
                      <input
                        type="date"
                        class="followup-date-input"
                        id="fup-${t.id}"
                        value="${t.followup || ''}"
                        onchange="updateFollowup('${t.id}', this.value)"
                        title="Set follow-up date"
                      />
                      ${t.followup ? `
                        <button class="btn-followup-check" onclick="markFollowedUp('${t.id}')" title="Log follow-up and schedule next">
                          &check; Followed Up
                        </button>
                      ` : ''}
                    </div>
                  </div>
                  ${historyMarkup}
                </div>
              `}

              <footer class="card-footer">
                <div class="flow-actions">
                  ${statusButtons}
                </div>
                <div class="card-tools">
                  <button class="btn-tool" onclick="openEditModal('${t.id}')" title="Edit task details">Edit</button>
                  <button class="btn-tool delete" onclick="deleteTask('${t.id}')" title="Delete task">&times;</button>
                </div>
              </footer>
            </article>`;
        }).join('');
      });

      // Update Top Metrics Readout
      document.getElementById('stat-total').textContent = String(tasks.length).padStart(2, '0');
      document.getElementById('stat-overdue').textContent = String(tasks.filter(t => isOverdue(t.date, t.status)).length).padStart(2, '0');
      document.getElementById('stat-done').textContent = String(tasks.filter(t => t.status === 'done').length).padStart(2, '0');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Initial State ──
    setDefaultDueDate();
  </script>
</body>
</html>
